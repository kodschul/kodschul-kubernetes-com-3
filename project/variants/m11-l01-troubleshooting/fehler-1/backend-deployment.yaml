apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hello-debug
  labels:
    app: hello
    tier: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
      tier: backend
  template:
    metadata:
      labels:
        app: hello
        tier: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: hello-backend:v1
          imagePullPolicy: Never        # lokal gebautes Image aus Lab 1.3
          ports:
            - containerPort: 80
