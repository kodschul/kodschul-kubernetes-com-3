# Lab 5.3 – Starter: GatewayClass und Gateway
# Kopieren nach playground/k8s/gateway.yaml, TODOs ergänzen, dann:
#   kubectl apply -f playground/k8s/gateway.yaml
# Voraussetzung: Envoy Gateway v1.10.0 ist installiert.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello-gateway
  namespace: gateway
spec:
  gatewayClassName: # TODO: Name der GatewayClass oben
  listeners:
    - name: http
      protocol: HTTP
      port: # TODO: Port des Eingangs (HTTP-Standardport)
      allowedRoutes:
        namespaces:
          from: All             # Routen aus allen Namespaces dürfen andocken
