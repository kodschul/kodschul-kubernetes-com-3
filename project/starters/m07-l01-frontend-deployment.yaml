# Lab 7.1 – Starter: Frontend-Deployment mit Volume für access.log
# Ersetzt playground/k8s/frontend-deployment.yaml, TODOs ergänzen, dann:
#   kubectl apply -f playground/k8s/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "access.log im emptyDir-Volume data"
spec:
  replicas: # TODO: 1 (ein Pod, damit jede Beobachtung dieselbe Datei trifft)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello
      tier: frontend
  template:
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v2
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: hello-config
          volumeMounts:
            # TODO: Volume "data" im Ordner /data einhängen (name + mountPath)
            - name: admin-secret
              mountPath: /etc/hello-secret
              readOnly: true
      volumes:
        # TODO: Volume "data" vom Typ emptyDir anlegen
        - name: admin-secret
          secret:
            secretName: hello-secret
