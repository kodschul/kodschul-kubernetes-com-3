# Starter Lab 10.2 – ServiceAccount hello-reader mit Leserecht auf Pods im Namespace hello
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-reader
  namespace: hello
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: hello
rules:
  - apiGroups: [""]
    resources: []                           # TODO: Ressource pods
    verbs: []                               # TODO: get, list, watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hello-reader-pod-reader
  namespace: hello
subjects:
  - kind: ServiceAccount
    name: ""                                # TODO: Name des ServiceAccounts
    namespace: hello
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
