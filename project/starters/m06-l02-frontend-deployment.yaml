# Lab 6.2 – Starter: Frontend-Deployment mit Secret-Volume
# Ersetzt playground/k8s/frontend-deployment.yaml, TODOs ergänzen, dann:
#   kubectl apply -f playground/k8s/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "Admin-Passwort aus Secret hello-secret"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello
      tier: frontend
  template:
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v2
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: hello-config
          volumeMounts:
            - name: admin-secret
              mountPath: # TODO: Ordner, in dem die App das Passwort sucht (/etc/hello-secret)
              readOnly: true
      volumes:
        - name: admin-secret
          secret:
            secretName: # TODO: Name des Secrets
