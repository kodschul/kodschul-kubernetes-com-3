# Lab 5.3 – Starter: HTTPRoute der Hello-App
# Kopieren nach playground/k8s/httproute.yaml, TODOs ergänzen, dann:
#   kubectl apply -f playground/k8s/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: hello-gateway
      namespace: gateway
  hostnames:
    - # TODO: Hostname der Hello-App (hello.localhost)
  rules:
    # TODO (Aufgabe 5): zweite Regel für den Pfad /api zum Service backend, Port 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: # TODO: Service des Frontends
          port: 80
