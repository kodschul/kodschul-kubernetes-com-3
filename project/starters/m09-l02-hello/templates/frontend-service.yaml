apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "hello.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "hello.selectorLabels" . | nindent 4 }}
    tier: frontend
  ports:
    - port: 80
      targetPort: http
