apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "hello.labels" . | nindent 4 }}
    tier: backend
spec:
  type: ClusterIP
  selector:
    {{- include "hello.selectorLabels" . | nindent 4 }}
    tier: backend
  ports:
    - port: 80
      targetPort: http           # Name des Container-Ports im Deployment
