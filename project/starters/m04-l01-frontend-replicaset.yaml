# Lab 4.1 – Starter: Frontend als ReplicaSet
# Kopieren nach playground/k8s/frontend-replicaset.yaml, TODOs ergänzen, dann:
#   kubectl apply -f playground/k8s/frontend-replicaset.yaml
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
spec:
  # TODO: Anzahl der Kopien auf 3 setzen (Feld replicas)
  selector:
    matchLabels:
      # TODO: die beiden Labels eintragen, an denen das ReplicaSet seine Pods erkennt
      #       (app und tier, nicht version)
  template:
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://10.1.0.23"   # TODO: aktuelle Pod-IP des Backends eintragen
