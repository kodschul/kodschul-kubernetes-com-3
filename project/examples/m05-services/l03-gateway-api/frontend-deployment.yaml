# Frontend unverändert aus Lab 4.3 (v2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "Update auf v2"   # Grund der Änderung, erscheint in rollout history
spec:
  replicas: 3
  strategy:
    type: RollingUpdate              # Pods schrittweise ersetzen (Standard)
    rollingUpdate:
      maxSurge: 1                    # höchstens 1 Pod über replicas während des Updates
      maxUnavailable: 0              # nie weniger als replicas bereite Pods
  selector:
    matchLabels:
      app: hello
      tier: frontend
  template:                          # jede Änderung hier startet einen Rollout
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v2                  # Label passt zur Image-Version
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v2   # neue Version: grüne Seite "Hello-App v2"
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://backend"   # DNS-Name des Service "backend" (Lab 5.1)
