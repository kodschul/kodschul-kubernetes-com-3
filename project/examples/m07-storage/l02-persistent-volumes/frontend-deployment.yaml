# Frontend-Deployment mit access.log auf dem PVC hello-data (Lab 7.2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "access.log auf PVC hello-data"
spec:
  replicas: 3                                # alle drei Pods laufen auf docker-desktop und teilen sich das Volume
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello
      tier: frontend
  template:
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v2
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: hello-config
          volumeMounts:
            - name: data                     # unverändert aus Lab 7.1: Ordner /data
              mountPath: /data
            - name: admin-secret
              mountPath: /etc/hello-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:             # statt emptyDir: Speicher, der unabhängig vom Pod existiert
            claimName: hello-data            # Name des PVC aus pvc.yaml
        - name: admin-secret
          secret:
            secretName: hello-secret
