# App-Teil (Lab 5.3): HTTPRoute der Hello-App im Namespace hello
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:                   # an welchem Gateway die Route andockt
    - name: hello-gateway
      namespace: gateway
  hostnames:                    # nur Anfragen an diesen Hostnamen
    - hello.localhost
  rules:
    - matches:                  # Regel 1: /api und alles darunter -> Backend
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend         # Service-Name im selben Namespace
          port: 80
    - matches:                  # Regel 2: alles andere -> Frontend
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
