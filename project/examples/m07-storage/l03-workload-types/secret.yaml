# Secret "hello-secret" (Lab 6.2)
# ÜBUNGSWERT: Echte Passwörter gehören nie in eine Datei, die in Git landet.
# Im Alltag: kubectl create secret generic hello-secret --from-literal=admin-password=<Wert>
apiVersion: v1
kind: Secret
metadata:
  name: hello-secret
  labels:
    app: hello
type: Opaque                    # allgemeines Secret mit frei wählbaren Schlüsseln
stringData:                     # Klartext beim Anlegen; Kubernetes speichert ihn Base64-codiert unter data:
  admin-password: uebung-2026   # Übungswert
