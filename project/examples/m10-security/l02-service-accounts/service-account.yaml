# Lab 10.2 – Identität für ein Programm: ServiceAccount hello-reader darf Pods in hello lesen
apiVersion: v1
kind: ServiceAccount                        # Konto für Pods statt für Menschen
metadata:
  name: hello-reader
  namespace: hello
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: hello
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]         # lesen ja, löschen nein
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hello-reader-pod-reader
  namespace: hello
subjects:
  - kind: ServiceAccount                    # Subjekt ist diesmal ein ServiceAccount
    name: hello-reader
    namespace: hello
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
