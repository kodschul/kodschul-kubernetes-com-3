# Lab 3.1: Frontend der Hello-App als einzelner Pod
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
spec:
  containers:
    - name: frontend
      image: hello-frontend:v1       # lokal gebautes Image aus Lab 1.3
      imagePullPolicy: Never
      ports:
        - containerPort: 80
      env:                           # Umgebungsvariablen für den Container
        - name: BACKEND_URL
          # Platzhalter: eigene Pod-IP des Backends eintragen
          # (kubectl get pod backend -o wide, Spalte IP)
          value: "http://10.1.0.23"
