# Frontend-Deployment mit Konfiguration aus der ConfigMap (Lab 6.1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "Konfiguration aus ConfigMap hello-config"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello
      tier: frontend
  template:
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v2
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:                       # jeder Schlüssel der ConfigMap wird eine Umgebungsvariable
            - configMapRef:
                name: hello-config       # BACKEND_URL und APP_COLOR
