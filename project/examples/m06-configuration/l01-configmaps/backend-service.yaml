# Service "backend": feste Adresse und DNS-Name für alle Backend-Pods (Lab 5.1)
apiVersion: v1
kind: Service
metadata:
  name: backend                 # DNS-Name im Cluster: backend (voll: backend.hello.svc.cluster.local)
  labels:
    app: hello
    tier: backend
spec:
  type: ClusterIP               # Standardtyp: nur innerhalb des Clusters erreichbar
  selector:                     # alle Pods mit diesen Labels bekommen Anfragen
    app: hello
    tier: backend
  ports:
    - port: 80                  # Port des Service (http://backend:80)
      targetPort: 80            # Port im Container (containerPort des Backends)
      protocol: TCP
