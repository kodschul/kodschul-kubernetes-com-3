# Service "frontend" wieder als ClusterIP (Lab 5.3):
# Der Zugang von außen läuft jetzt über das Gateway auf localhost:80.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: hello
    tier: frontend
  ports:
    - port: 80                  # die HTTPRoute verweist auf frontend:80
      targetPort: 80
      protocol: TCP
