# Frontend-Deployment mit Probes (Lab 8.1) und Requests/Limits (Lab 8.2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "Requests und Limits"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello
      tier: frontend
  template:
    metadata:
      labels:
        app: hello
        tier: frontend
        version: v2
    spec:
      containers:
        - name: frontend
          image: hello-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: hello-config
          resources:
            requests:                        # Planung: so viel reserviert der Scheduler auf dem Node
              cpu: 100m                      # 100 Millicores = 10 % eines CPU-Kerns (Bezugsgröße für das HPA in Lab 8.3)
              memory: 64Mi
            limits:                          # Obergrenze zur Laufzeit
              cpu: 500m                      # mehr CPU -> gedrosselt
              memory: 128Mi                  # mehr Speicher -> OOMKilled
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: admin-secret
              mountPath: /etc/hello-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hello-data
        - name: admin-secret
          secret:
            secretName: hello-secret
